<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1B3A5E"/>
      <stop offset="0.55" stop-color="#0E1E36"/>
      <stop offset="1" stop-color="#05070D"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E6F7FF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#9FDFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9FDFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E5383B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E5383B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- ruined skyline -->
  <g fill="#0A1426">
    <path d="M0 860 L0 760 L70 760 L70 700 L140 700 L140 780 L190 780 L190 650 L230 640 L260 655 L260 800 L330 800 L330 720 L380 720 L380 860 Z"/>
    <path d="M700 860 L700 740 L760 740 L760 670 L800 690 L830 660 L830 780 L900 780 L900 700 L960 700 L960 760 L1010 760 L1010 690 L1080 690 L1080 860 Z"/>
  </g>
  <!-- smoke columns -->
  <g fill="#2A3A52" opacity="0.5">
    <ellipse cx="215" cy="560" rx="40" ry="90"/><ellipse cx="240" cy="440" rx="60" ry="80"/>
    <ellipse cx="840" cy="590" rx="35" ry="80"/><ellipse cx="870" cy="480" rx="55" ry="75"/>
  </g>
  <!-- red alert halo behind head -->
  <circle cx="540" cy="520" r="330" fill="url(#redglow)"/>
  <circle cx="540" cy="520" r="300" fill="none" stroke="#E5383B" stroke-width="10" opacity="0.85"/>
  <!-- Sleeper: head + shoulders, tilted -->
  <g transform="rotate(-12 540 560)">
    <!-- shoulders/body -->
    <rect x="300" y="760" width="480" height="360" rx="36" fill="#7D8592"/>
    <rect x="300" y="760" width="480" height="22" rx="11" fill="#A3AAB5"/>
    <!-- neck -->
    <rect x="470" y="700" width="140" height="90" fill="#AEB4BE"/>
    <!-- head -->
    <rect x="335" y="300" width="410" height="430" rx="46" fill="#C9CED6"/>
    <rect x="335" y="300" width="410" height="26" rx="13" fill="#E3E7EC"/>
    <rect x="335" y="700" width="410" height="30" rx="15" fill="#A7AEB9"/>
    <!-- under-eye circles -->
    <rect x="380" y="500" width="130" height="62" rx="24" fill="#8C8FA6"/>
    <rect x="570" y="500" width="130" height="62" rx="24" fill="#8C8FA6"/>
    <!-- left eye CLOSED -->
    <rect x="392" y="492" width="106" height="16" rx="8" fill="#1B2232"/>
    <!-- right eye OPEN, glowing -->
    <circle cx="635" cy="500" r="120" fill="url(#glow)"/>
    <rect x="585" y="466" width="100" height="58" rx="12" fill="#E6F7FF"/>
    <rect x="620" y="478" width="34" height="34" rx="6" fill="#0B1F3A"/>
    <!-- mouth -->
    <rect x="490" y="630" width="100" height="14" rx="7" fill="#7E8594"/>
    <!-- humming throat lines -->
    <g stroke="#E6F7FF" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M445 740 q-20 15 0 30"/><path d="M415 735 q-30 22 0 45"/>
      <path d="M635 740 q20 15 0 30"/><path d="M665 735 q30 22 0 45"/>
    </g>
  </g>
  <!-- A / B pills -->
  <g font-family="Bebas Neue, Montserrat, Arial Black, sans-serif" font-weight="900" font-size="120" text-anchor="middle">
    <rect x="70" y="140" width="170" height="170" rx="40" fill="#C8E234"/>
    <text x="155" y="270" fill="#0A0D16">A</text>
    <rect x="840" y="140" width="170" height="170" rx="40" fill="#E5383B"/>
    <text x="925" y="270" fill="#FFFFFF">B</text>
  </g>
</svg>
