<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920" style="width:540px;height:960px;display:block"></canvas>
<style>@font-face{font-family:Montserrat;src:url(Montserrat.ttf);font-weight:100 900}@font-face{font-family:"Bebas Neue";src:url(BebasNeue.ttf)}@font-face{font-family:"JetBrains Mono";src:url(JetBrainsMono.ttf);font-weight:100 900}@font-face{font-family:Caveat;src:url(Caveat.ttf)}</style>
<script charset="utf-8" src="data.js"></script><script charset="utf-8" src="render.js"></script>
<script>window.ready=Promise.all([new FontFace('Montserrat','url(Montserrat.ttf)',{weight:'100 900'}).load(),new FontFace('Bebas Neue','url(BebasNeue.ttf)').load(),new FontFace('JetBrains Mono','url(JetBrainsMono.ttf)',{weight:'100 900'}).load(),new FontFace('Caveat','url(Caveat.ttf)').load()]).then(fs=>{fs.forEach(f=>document.fonts.add(f));return true})</script></body></html>
